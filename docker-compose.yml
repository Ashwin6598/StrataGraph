services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: codegraph-falkordb
    ports:
      - "6379:6379"
      - "3000:3000"
    volumes:
      - falkor_data:/data
    restart: unless-stopped
    environment:
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-}

volumes:
  falkor_data:
    driver: local
